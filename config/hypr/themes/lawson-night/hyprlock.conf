general {
    hide_cursor = true
}
animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldColors, 1, 3, soft
    animation = inputFieldDots, 1, 3, soft
    animation = inputFieldFade, 1, 3, soft
}
background {
    monitor =
    path = @HOME@/.config/hypr/wallpaper-active
    blur_passes = 2
    blur_size = 4
    brightness = 0.65
    color = rgb(1e1e2e)
}
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(cdd6f4)
    font_size = 112
    font_family = Noto Sans Light
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}
label {
    monitor =
    text = cmd[update:1000] date +'%A, %B %d   ·   %S'
    color = rgb(89b4fa)
    font_size = 17
    font_family = Noto Sans
    position = 0, 30
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 54
    rounding = 27
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(89b4fa88)
    inner_color = rgba(1e1e2ebb)
    font_color = rgb(cdd6f4)
    check_color = rgb(89b4fa)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(89b4fa)
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">Enter password</span>
    fail_text = <i>Try again · $ATTEMPTS</i>
    position = 0, -90
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgb(cdd6f4)
    font_size = 13
    position = 0, 50
    halign = center
    valign = bottom
}
